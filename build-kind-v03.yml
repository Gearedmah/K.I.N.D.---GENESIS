name: Build KIND Radio v0.3 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'KIND-Radio-Integrated-HOME-Genesis-v0.3-source.zip'
      - '.github/workflows/build-kind-v03.yml'
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unpack integrated Android project
        run: |
          test -f KIND-Radio-Integrated-HOME-Genesis-v0.3-source.zip
          mkdir -p "$RUNNER_TEMP/kind-src"
          unzip -q KIND-Radio-Integrated-HOME-Genesis-v0.3-source.zip -d "$RUNNER_TEMP/kind-src"
      - name: Build debug APK
        run: gradle --no-daemon --project-dir "$RUNNER_TEMP/kind-src" :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KIND-Radio-v0.3-debug-APK
          path: ${{ runner.temp }}/kind-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
